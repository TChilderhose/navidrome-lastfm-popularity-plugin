name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install TinyGo
        run: |
            wget https://github.com/tinygo-org/tinygo/releases/download/v0.43.0/tinygo_0.43.0_amd64.deb
            sudo dpkg -i tinygo_0.43.0_amd64.deb
            sudo apt install -y binaryen

      - name: Run tests
        run: make test

      - name: Append git SHA to version
        if: github.event_name == 'push'
        run: |
            SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            jq --arg sha "$SHA" '.version = .version + "-" + $sha' manifest.json > manifest.tmp && mv manifest.tmp manifest.json

      - name: Build and package plugin
        run: make package

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: navidrome-lastfm-popularity-plugin
          path: navidrome-lastfm-popularity-plugin.ndp
